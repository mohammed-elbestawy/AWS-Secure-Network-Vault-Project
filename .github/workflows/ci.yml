name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Flask
        run: pip install "Flask==3.1.*"
      - name: Backend tests
        run: python -m unittest discover -s code/tests -v
      - name: Crypto tests
        run: node --test code/tests/crypto.test.mjs
      - name: End-to-end against a local server
        run: |
          cd code/backend
          STORE=memory python -c "from wsgi import app; app.run(port=8099)" &
          sleep 3
          cd ..
          BASE_URL=http://127.0.0.1:8099 node tests/e2e-local.mjs
      - name: Project page is served
        run: |
          cd code/backend
          STORE=memory python -c "from wsgi import app; app.run(port=8098)" &
          sleep 3
          for path in / /about.html /security.html /assets/img/architecture.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:8098$path"
          done
      - name: Shell syntax
        run: |
          for f in code/deploy/*.sh code/infra/*.sh code/infra/wireguard/*.sh code/scripts/*.sh; do
            bash -n "$f"
          done
